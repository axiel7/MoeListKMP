# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Conveyor build

on:
  workflow_dispatch:

jobs:
  build:
  
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'oracle'

    - name: Create private.properties
      run: |
        echo "CLIENT_SECRET=$CLIENT_SECRET_ENV_VAR" > private.properties
      env:
        CLIENT_SECRET_ENV_VAR: ${{ secrets.CLIENT_SECRET }}

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Gradle run permission
      run: chmod +x ./gradlew

    - name: Build .jar with Gradle Wrapper
      run: ./gradlew :app:desktopApp:jar

    - name: Run Conveyor     
      uses: hydraulic-software/conveyor/actions/build@v22.0
      with:
        command: make copied-site
        signing_key: ${{ secrets.SIGNING_KEY }}
        agree_to_license: 1

    - name: Setup AppImage AppDir
      run: cp ./moelist.desktop ./output && mv ./output ./AppDir

    - name: Build AppImage
      uses: AppImageCrafters/build-appimage@master
      with:
        recipe: "./AppImageBuilder.yml"
      env:
        UPDATE_INFO: gh-releases-zsync|AppImageCrafters|moelist|latest|*x86_64.AppImage.zsync

    - name: Upload build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: Linux-AppImage-x86_64
        path: ${{github.workspace}}/*.AppImage
        
