app-id: com.axiel7.moelist
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: moelist
finish-args:
  - --share=network

modules:
  - name: jbr
    buildsystem: simple
    build-commands:
      - mkdir -p /app/jre
      - tar xzf jbr-*.tar.gz -C /app/jre --strip-components=1
    sources:
      - type: file
        url: https://cache-redirector.jetbrains.com/intellij-jbr/jbr-21.0.10-linux-x64-b1163.105.tar.gz
        sha256: b6a3b13451d296140727bbde9325dd9ee422e2e9b2c6a9378f346f1b8d1111bc
        only-arches:
          - x86_64
      - type: file
        url: https://cache-redirector.jetbrains.com/intellij-jbr/jbr-21.0.10-linux-aarch64-b1163.105.tar.gz
        sha256: 38804f526d869f5a9c49e9b90c04edcbc918b41e8e43264e5d5076d352a959bc
        only-arches:
          - aarch64

  - name: moelist
    buildsystem: simple
    build-options:
      append-path: "/usr/lib/sdk/openjdk21/bin"
    build-commands:
      - export JAVA_HOME=/usr/lib/sdk/openjdk21/bin
      - echo "CLIENT_SECRET=$CLIENT_SECRET_ENV_VAR" > private.properties
      - ./.scripts/flatpak-build-setup.sh
      - ./gradlew app:desktopApp:packageReleaseUberJarForCurrentOS --no-daemon --offline -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=2g" -Dorg.gradle.daemon=true -Dorg.gradle.parallel=false --no-configuration-cache
      - JAR_FILE=$(find app/desktopApp/build/compose/jars/ -name "*.jar" -type f | head -1) && install -Dm755 "$JAR_FILE" /app/lib/moelist.jar
      - install -Dm644 moelist.desktop /app/share/applications/com.axiel7.moelist.desktop
      - install -Dm644 app/desktopApp/packaging/flatpak/com.axiel7.moelist.metainfo.xml /app/share/metainfo/com.axiel7.moelist.metainfo.xml
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/moelist.svg
      - mkdir -p /app/bin
      - install -Dm755 app/desktopApp/packaging/flatpak/moelist.sh /app/bin/moelist
    sources:
      - type: git
        url: ../../../../
        branch: flatpak
      - type: file
        url: "https://services.gradle.org/distributions/gradle-9.4.1-bin.zip"
        sha256: "2ab2958f2a1e51120c326cad6f385153bb11ee93b3c216c5fccebfdfbb7ec6cb"
        dest: "gradle/wrapper"
        dest-filename: "gradle-bin.zip"
      - gradle-dependencies.json
