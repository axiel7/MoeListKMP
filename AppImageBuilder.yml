# appimage-builder recipe see https://appimage-builder.readthedocs.io for details
version: 1
script:
  - rm -rf AppDir || true
  - mv output AppDir
  - mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps/
  - mv AppDir/bin AppDir/usr/
  - mv AppDir/lib AppDir/usr/
  - cp AppDir/usr/lib/app/icon.svg AppDir/usr/share/icons/hicolor/scalable/apps/moelist.svg
AppDir:
  path: ./AppDir
  app_info:
    id: com.axiel7.moelist
    name: MoeList
    icon: moelist
    version: latest
    exec: usr/bin/moelist
    exec_args: $@
  runtime:
    env:
      # Ensure the JVM shared libraries are found by the launcher
      LD_LIBRARY_PATH: '${APPDIR}/usr/lib/runtime/lib/server:${APPDIR}/usr/lib/runtime/lib:${LD_LIBRARY_PATH}'
  files:
    include:
      - usr/bin/moelist
      - usr/lib/**
      - usr/share/**
    exclude:
      - usr/share/man
      - usr/share/doc/*/README.*
      - usr/share/doc/*/changelog.*
      - usr/share/doc/*/NEWS.*
      - usr/share/doc/*/TODO.*
  test:
    fedora-30:
      image: appimagecrafters/tests-env:fedora-30
      command: ./AppRun
    debian-stable:
      image: appimagecrafters/tests-env:debian-stable
      command: ./AppRun
    archlinux-latest:
      image: appimagecrafters/tests-env:archlinux-latest
      command: ./AppRun
    centos-7:
      image: appimagecrafters/tests-env:centos-7
      command: ./AppRun
    ubuntu-xenial:
      image: appimagecrafters/tests-env:ubuntu-xenial
      command: ./AppRun
AppImage:
  arch: x86_64
  update-information: guess
